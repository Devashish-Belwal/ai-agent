name: CI/CD Multi-Instance Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma Client
        run: bun run --cwd packages/database db:generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/agentic"

      - name: Run Typecheck
        run: bun run typecheck

  build-and-push:
    name: Build & Push Docker Images
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/agentic-api:latest

      - name: Build & Push Web Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/agentic-web:latest
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.dabelwal.online
            NEXT_PUBLIC_LIVEKIT_URL=wss://livekit.dabelwal.online

      - name: Build & Push Voice Agent Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/voice-agent/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/agentic-voice-agent:latest

  deploy-frontend:
    name: Deploy Frontend (Instance 1)
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync Infra configurations to EC2 Frontend
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_FRONTEND_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          source: "infra/"
          target: "~/agentic"

      - name: Deploy to EC2 Frontend
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          host: ${{ secrets.EC2_FRONTEND_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          envs: DOCKERHUB_USERNAME
          script: |
            set -e
            mkdir -p ~/agentic/infra/caddy
            cd ~/agentic
            
            if [ -f infra/.env ] && [ ! -f .env ]; then
              cp infra/.env .env
            fi

            if [ ! -f .env ]; then
              echo "Notice: Creating ~/agentic/.env from deployment variables..."
              {
                echo "DOCKERHUB_USERNAME=${DOCKERHUB_USERNAME}"
                echo "NEXT_PUBLIC_API_URL=https://api.dabelwal.online"
                echo "NEXT_PUBLIC_LIVEKIT_URL=wss://livekit.dabelwal.online"
              } > .env
            fi

            export DOCKERHUB_USERNAME="${DOCKERHUB_USERNAME}"

            docker compose -f infra/docker-compose.web.yml pull
            docker compose -f infra/docker-compose.web.yml up -d --remove-orphans
            docker image prune -f
            echo "Instance 1 (Frontend) deployed successfully!"

  deploy-backend:
    name: Deploy Backend & DB (Instance 2)
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync Infra configurations to EC2 Backend
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_BACKEND_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          source: "infra/"
          target: "~/agentic"

      - name: Deploy to EC2 Backend & DB
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'postgres' }}
        with:
          host: ${{ secrets.EC2_BACKEND_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          envs: DOCKERHUB_USERNAME,BETTER_AUTH_SECRET,LIVEKIT_API_SECRET,OPENAI_API_KEY,GEMINI_API_KEY,POSTGRES_PASSWORD
          script: |
            set -e
            mkdir -p ~/agentic/infra/caddy
            cd ~/agentic
            
            if [ -f infra/.env ] && [ ! -f .env ]; then
              cp infra/.env .env
            fi

            # If no .env exists on host, bootstrap it from deployment secrets
            if [ ! -f .env ]; then
              echo "Notice: Creating ~/agentic/.env from deployment secrets..."
              {
                echo "DOCKERHUB_USERNAME=${DOCKERHUB_USERNAME}"
                echo "NODE_ENV=production"
                echo "PORT=4000"
                echo "POSTGRES_USER=postgres"
                echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
                echo "POSTGRES_DB=agentic"
                echo "REDIS_URL=redis://redis:6379"
                echo "BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-default_better_auth_secret_key_32_chars}"
                echo "BETTER_AUTH_URL=https://api.dabelwal.online"
                echo "WEB_ORIGIN=https://agentic.dabelwal.online"
                echo "LIVEKIT_URL=wss://livekit.dabelwal.online"
                echo "LIVEKIT_API_KEY=devkey"
                echo "LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secret_must_be_at_least_32_characters_long}"
                echo "GEMINI_API_KEY=${GEMINI_API_KEY}"
                echo "OPENAI_API_KEY=${OPENAI_API_KEY}"
              } > .env
            fi

            export DOCKERHUB_USERNAME="${DOCKERHUB_USERNAME}"

            docker compose -f infra/docker-compose.api.yml pull
            docker compose -f infra/docker-compose.api.yml up -d postgres redis
            
            # Wait for postgres to be ready before running migration
            for i in $(seq 1 30); do
              if docker compose -f infra/docker-compose.api.yml exec -T postgres pg_isready -U postgres >/dev/null 2>&1; then
                break
              fi
              sleep 1
            done

            docker compose -f infra/docker-compose.api.yml run --rm api bun run db:migrate:deploy || true
            docker compose -f infra/docker-compose.api.yml up -d --remove-orphans
            docker image prune -f
            echo "Instance 2 (Backend & DB) deployed successfully!"

  deploy-voice:
    name: Deploy LiveKit & Voice Agent (Instance 3)
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync Infra configurations to EC2 Voice
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_VOICE_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          source: "infra/"
          target: "~/agentic"

      - name: Deploy to EC2 LiveKit & Voice
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          host: ${{ secrets.EC2_VOICE_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          envs: DOCKERHUB_USERNAME,LIVEKIT_API_SECRET,OPENAI_API_KEY,GEMINI_API_KEY
          script: |
            set -e
            mkdir -p ~/agentic/infra/caddy ~/agentic/infra/livekit
            cd ~/agentic
            
            if [ -f infra/.env ] && [ ! -f .env ]; then
              cp infra/.env .env
            fi

            # If no .env exists on host, bootstrap it from GitHub Secrets
            if [ ! -f .env ]; then
              echo "Notice: Creating ~/agentic/.env from deployment secrets..."
              {
                echo "DOCKERHUB_USERNAME=${DOCKERHUB_USERNAME}"
                echo "LIVEKIT_URL=ws://127.0.0.1:7880"
                echo "LIVEKIT_API_KEY=devkey"
                echo "LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secret_must_be_at_least_32_characters_long}"
                echo "API_URL=https://api.dabelwal.online"
                echo "OPENAI_API_KEY=${OPENAI_API_KEY}"
                echo "OPENAI_REALTIME_MODEL=gpt-realtime-mini"
                echo "GEMINI_API_KEY=${GEMINI_API_KEY}"
              } > .env
            fi

            export DOCKERHUB_USERNAME="${DOCKERHUB_USERNAME}"

            docker compose -f infra/docker-compose.voice.yml pull
            docker compose -f infra/docker-compose.voice.yml up -d --remove-orphans
            docker image prune -f
            echo "Instance 3 (LiveKit & Voice) deployed successfully!"
