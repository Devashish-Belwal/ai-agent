services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agentic_local_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentic
    ports:
      - "5434:5432"
    volumes:
      - local_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agentic"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agentic_local_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - local_redisdata:/data

  livekit:
    image: livekit/livekit-server:v1.13.10
    container_name: agentic_local_livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml --node-ip 127.0.0.1
    environment:
      NODE_IP: "127.0.0.1"
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

volumes:
  local_pgdata:
  local_redisdata:
